esphome:
  name: timesync-demo

external_components:
  - source: components
    components: [zigbee]

esp32:
  board: esp32-h2-devkitm-1
  framework:
    type: esp-idf

logger:

zigbee:
  id: "zb"
  endpoints:
    # We need at least one endpoint defined
    - device_type: TEMPERATURE_SENSOR
      num: 1
      clusters:
        - id: TEMPERATURE_MEASUREMENT
          attributes:
            - attribute_id: 0x0
              type: INT16
              report: true
              id: zb_temp
              value: 0
  on_join:
    then:
      - logger.log: "Joined network"

time:
  - platform: zigbee
    id: the_time
    timezone: Europe/London
    update_interval: 90s
    on_time_sync:
      then:
        - logger.log: "Synchronized system clock"
    on_time:
      - seconds: /10
        then:
          - logger.log: "Tick-tock, every 10 seconds"
